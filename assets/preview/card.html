<!doctype html>
<!-- The picture a link to the test is shown with on social media, a chat or
     anywhere else that unfurls one (og:image in the root index.html). It is
     the landing page's hero redrawn at 1200×630, the size those previews are
     cut to, and it is not part of the page: nothing loads it. card.jpg beside
     it is this, photographed by make.py — change this file, run that, and
     commit both. The look is the app's restated rather than imported, the way
     docs/ does it, so the app's stylesheet can move without moving this. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>The Abyss Test: preview card</title>
        <style>
            :root {
                --bg: #05070d;
                --muted: #d2d8e7;
                --accent: #7c5cff;
                --accent-2: #22d3ee;
                --gold: #d9a441;
                --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            }

            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--bg);
            }

            /* The water the landing page opens on: body[data-screen="intro"]::before. */
            .card {
                position: relative;
                width: 1200px;
                height: 630px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: ui-sans-serif, system-ui, sans-serif;
                color: var(--muted);
                background-image: radial-gradient(120% 70% at 50% -10%, rgba(124, 92, 255, 0.24), transparent 60%),
                    radial-gradient(90% 55% at 12% 8%, rgba(34, 211, 238, 0.13), transparent 62%),
                    radial-gradient(140% 100% at 50% 120%, rgba(3, 4, 8, 0.9), transparent 55%),
                    linear-gradient(180deg, #090d18 0%, var(--bg) 45%, #020308 100%);
            }

            /* The iris behind the name, held at the wide end of its dilation. */
            .iris {
                position: absolute;
                top: 48%;
                left: 50%;
                width: 760px;
                aspect-ratio: 1;
                transform: translate(-50%, -50%);
                border-radius: 50%;
                background: radial-gradient(circle, rgba(124, 92, 255, 0.2) 0%, rgba(124, 92, 255, 0.07) 38%, transparent 66%);
            }

            /* The wheel inside the iris, as on the page (.hero__web), open and still. */
            .web {
                position: absolute;
                inset: 22%;
                overflow: visible;
                -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 72%);
                mask-image: radial-gradient(circle, #000 52%, transparent 72%);
            }

            .web * {
                vector-effect: non-scaling-stroke;
            }

            .web__ring {
                fill: none;
                stroke: rgba(176, 160, 255, 0.07);
            }

            .web__petal {
                fill: var(--petal);
                fill-opacity: 0.14;
                stroke: var(--petal);
                stroke-opacity: 0.34;
                stroke-linejoin: round;
            }

            .logos {
                position: absolute;
                top: 34px;
                left: 44px;
                display: flex;
                align-items: center;
                gap: 22px;
            }

            .logos img {
                height: 58px;
                width: auto;
            }

            .the {
                position: relative;
                font-size: 22px;
                font-weight: 600;
                letter-spacing: 0.62em;
                text-indent: 0.62em;
                text-transform: uppercase;
                margin: 44px 0 10px;
            }

            .title {
                position: relative;
                font-family: var(--serif);
                font-size: 212px;
                line-height: 0.9;
                letter-spacing: 0.06em;
                text-indent: 0.06em;
                text-transform: uppercase;
                background: linear-gradient(178deg, #ffffff 4%, #c3cdeb 34%, rgba(120, 133, 175, 0.76) 66%, rgba(88, 98, 140, 0.36) 96%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .sub {
                position: relative;
                margin: 26px 0 0;
                font-family: var(--serif);
                font-size: 32px;
                font-style: italic;
                color: #c8cfe4;
            }

            .meta {
                position: relative;
                margin: 22px 0 0;
                font-size: 17px;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .meta i {
                font-style: normal;
                opacity: 0.45;
                margin: 0 6px;
            }

            /* The favicon: the A over the wheel, as in the root index.html's head. */
            .mark {
                position: absolute;
                right: 46px;
                top: 30px;
                width: 66px;
                height: 66px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="iris">
                <svg class="web" viewBox="-102 -102 204 204">
                    <defs>
                        <radialGradient id="hole" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="100">
                        <stop offset="0" stop-color="#020308" stop-opacity="0.660" />
                        <stop offset="0.125" stop-color="#020308" stop-opacity="0.632" />
                        <stop offset="0.25" stop-color="#020308" stop-opacity="0.557" />
                        <stop offset="0.375" stop-color="#020308" stop-opacity="0.451" />
                        <stop offset="0.5" stop-color="#020308" stop-opacity="0.330" />
                        <stop offset="0.625" stop-color="#020308" stop-opacity="0.209" />
                        <stop offset="0.75" stop-color="#020308" stop-opacity="0.103" />
                        <stop offset="0.875" stop-color="#020308" stop-opacity="0.028" />
                        <stop offset="1" stop-color="#020308" stop-opacity="0.000" />
                        </radialGradient>
                    </defs>
                    <circle class="web__ring" r="33.3" />
                    <circle class="web__ring" r="66.7" />
                    <circle class="web__ring" r="100.0" />
                    <path class="web__petal" style="--petal: #5b3fd6" d="M0 0L-14.4 -64.4A66.0 66.0 0 0 1 14.4 -64.4Z" />
                    <path class="web__petal" style="--petal: #a58bff" d="M0 0L26.3 -84.0A88.0 88.0 0 0 1 59.6 -64.8Z" />
                    <path class="web__petal" style="--petal: #6d4be0" d="M0 0L38.3 -35.2A52.0 52.0 0 0 1 49.6 -15.6Z" />
                    <path class="web__petal" style="--petal: #c3a8ff" d="M0 0L72.2 -16.1A74.0 74.0 0 0 1 72.2 16.1Z" />
                    <path class="web__petal" style="--petal: #7c5cff" d="M0 0L91.6 28.7A96.0 96.0 0 0 1 70.7 65.0Z" />
                    <path class="web__petal" style="--petal: #9d7bf0" d="M0 0L40.6 44.2A60.0 60.0 0 0 1 17.9 57.3Z" />
                    <path class="web__petal" style="--petal: #6a3fc2" d="M0 0L17.9 80.0A82.0 82.0 0 0 1 -17.9 80.0Z" />
                    <path class="web__petal" style="--petal: #b89cff" d="M0 0L-14.4 45.8A48.0 48.0 0 0 1 -32.5 35.3Z" />
                    <path class="web__petal" style="--petal: #8455e8" d="M0 0L-51.5 47.4A70.0 70.0 0 0 1 -66.8 20.9Z" />
                    <path class="web__petal" style="--petal: #a07ae8" d="M0 0L-87.8 19.6A90.0 90.0 0 0 1 -87.8 -19.6Z" />
                    <path class="web__petal" style="--petal: #7448d1" d="M0 0L-53.4 -16.7A56.0 56.0 0 0 1 -41.2 -37.9Z" />
                    <path class="web__petal" style="--petal: #8a6cff" d="M0 0L-52.8 -57.4A78.0 78.0 0 0 1 -23.3 -74.4Z" />
                    <!-- The middle is a hole: dark at the centre, gone by the petals' tips. -->
                    <circle class="web__hole" r="100" fill="url(#hole)" />
                </svg>
            </div>

            <div class="logos">
                <img src="../logo_sussex.svg" alt="" />
                <img src="../logo_researchplus.png" alt="" />
                <img src="../logo_rebel.png" alt="" />
            </div>

            <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id='mark-b' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1a2250'/><stop offset='1' stop-color='#070b1c'/></linearGradient><linearGradient id='mark-a' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.45' stop-color='#c9d1ee'/><stop offset='1' stop-color='#7d88b8'/></linearGradient><radialGradient id='mark-h'><stop offset='0' stop-color='#070b1c' stop-opacity='.7'/><stop offset='1' stop-color='#070b1c' stop-opacity='0'/></radialGradient></defs><rect width='64' height='64' rx='14' fill='url(#mark-b)'/><g fill-opacity='.42' stroke='#b9a6ff' stroke-opacity='.35' stroke-width='.8' stroke-linejoin='round'><path d='M32 33L27.9 14.3A19.1 19.1 0 0 1 36.1 14.3Z' fill='#5b3fd6'/><path d='M32 33L39.7 8.7A25.5 25.5 0 0 1 49.2 14.2Z' fill='#a58bff'/><path d='M32 33L43.1 22.8A15.1 15.1 0 0 1 46.4 28.5Z' fill='#6d4be0'/><path d='M32 33L53.0 28.4A21.5 21.5 0 0 1 53.0 37.6Z' fill='#c3a8ff'/><path d='M32 33L58.6 41.4A27.8 27.8 0 0 1 52.5 51.8Z' fill='#7c5cff'/><path d='M32 33L43.8 45.8A17.4 17.4 0 0 1 37.2 49.6Z' fill='#9d7bf0'/><path d='M32 33L37.1 56.2A23.8 23.8 0 0 1 26.9 56.2Z' fill='#6a3fc2'/><path d='M32 33L27.8 46.3A13.9 13.9 0 0 1 22.6 43.3Z' fill='#b89cff'/><path d='M32 33L17.0 46.7A20.3 20.3 0 0 1 12.6 39.1Z' fill='#8455e8'/><path d='M32 33L6.5 38.6A26.1 26.1 0 0 1 6.5 27.4Z' fill='#a07ae8'/><path d='M32 33L16.5 28.1A16.2 16.2 0 0 1 20.0 22.0Z' fill='#7448d1'/><path d='M32 33L16.7 16.3A22.6 22.6 0 0 1 25.2 11.4Z' fill='#8a6cff'/></g><circle cx='32' cy='33' r='29' fill='url(#mark-h)'/><path d='M30.6 8.5L34.2 8.5L48.6 49.5L53 50.5L53 53L39.5 53L39.5 50.5L42.3 49.8L38.9 40L23 40L19.4 49.8L22.5 50.5L22.5 53L11.5 53L11.5 50.5L15.6 49.8ZM31 17.7L37.6 36.5L24.2 36.5Z' fill='url(#mark-a)' fill-rule='evenodd'/></svg>

            <div class="the">The</div>
            <div class="title">Abyss</div>
            <p class="sub">The Science-based Assessment of Deep Personality</p>
            <p class="meta">Research-grade measures <i>·</i> immediate results <i>·</i> entirely anonymous</p>
        </div>
    </body>
</html>

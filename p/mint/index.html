<!doctype html>
<!-- The test as the link has it, unfurled with the Brain-Body Axis's card.
     A crawler reads the tags below and runs no script, so a link to this page
     unfurls with assets/preview/mint.jpg (photographed from mint.html by
     make.py there) rather than the test's; a person is sent straight on to the
     test with the link's query exactly as it was (?project=, ?source=, ?pid=,
     ?start=, ?test=), so p/mint/?project=mint is the same run as ?project=mint.
     That is the whole difference from start/: this page changes the picture
     and nothing else, which is why its words promise no duration. Nothing of
     the app is loaded here. Like the root page, no og:url, on purpose; the
     image's ?v= is raised whenever the picture changes, or the apps that cache
     a preview by its address go on showing the old one. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>How well do you sense your body? · The Abyss Test</title>
        <meta name="description" content="Your heartbeat, your breath, your gut: find out how clearly your body speaks to you." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="The Abyss Test" />
        <meta property="og:title" content="How well do you sense your body? · The Abyss Test" />
        <meta property="og:description" content="Your heartbeat, your breath, your gut: find out how clearly your body speaks to you. Research-grade measures, results as you go, entirely anonymous." />
        <meta property="og:image" content="https://realitybendinglab.com/TestYourself/assets/preview/mint.jpg?v=1" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="The Abyss: how well do you sense your body? A slice of brain with nerves running down into the lungs, heart, stomach and gut" />
        <meta name="twitter:card" content="summary_large_image" />
        <script>
            location.replace("../../" + location.search)
        </script>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #05070d;
                color: #d2d8e7;
                font-family: ui-sans-serif, system-ui, sans-serif;
            }

            a {
                color: #f3e3c3;
            }
        </style>
    </head>
    <body>
        <p><a href="../../">Take the Abyss Test</a></p>
    </body>
</html>
